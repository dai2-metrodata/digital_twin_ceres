server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSP for Three.js/WebGL — permissive enough for SPCS auth proxy injection
    # NOTE: Do NOT set Cross-Origin-Opener-Policy or Cross-Origin-Embedder-Policy here;
    # the SPCS auth proxy sets its own and duplicates cause WebGL context creation to fail.
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' blob: data: https: wss:; worker-src 'self' blob:; frame-src 'self' blob:;" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve JS/CSS with correct MIME types and caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /healthcheck {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
